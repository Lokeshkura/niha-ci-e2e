# .github/workflows/niha-governance.yml
# niha Governance - runs on every PR.
# Generated by: niha ci agent init
#
# Self-contained: installs the niha CLI, signs in with an API key, runs
# `niha check`, and posts the verdict as a PR comment. It does not use
# any action outside this repository.
#
# Setup:
#   1. Add the NIHA_API_KEY repository secret (issued in the niha console).
#   2. Set the NIHA_WORKSPACE_ID repository variable, or pin it with
#      `niha ci agent init --workspace-id <id>`.
#
# Pull requests from forks never receive secrets, so those runs fail at
# the first step with a "NIHA_API_KEY secret is not set" error.

name: niha Governance

on:
  pull_request:
    branches: [main, develop]

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to post the PR comment
    env:
      NIHA_WORKSPACE_ID: ${{ vars.NIHA_WORKSPACE_ID }}
      NIHA_FAIL_ON: blocked     # blocked | restricted | advisory | never
    steps:
      - name: Check NIHA_API_KEY secret
        env:
          NIHA_API_KEY: ${{ secrets.NIHA_API_KEY }}
        run: |
          if [ -z "$NIHA_API_KEY" ]; then
            echo "::error::The NIHA_API_KEY secret is not set, so niha cannot sign in. Add it under Settings > Secrets and variables > Actions. Pull requests from forks never receive secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install niha CLI
        run: curl -fsSL https://cli.nihaandco.com/install.sh | bash

      - name: Evaluate governance rules
        id: evaluate
        env:
          NIHA_API_KEY: ${{ secrets.NIHA_API_KEY }}
        run: |
          set -euo pipefail
          threshold="$NIHA_FAIL_ON"
          trace=/tmp/niha-trace.json

          # No readable verdict: record ERROR and fail closed unless
          # fail-on is "never".
          report_error() {
            echo "::error::$1"
            {
              echo "decision=ERROR"
              echo "passed=0"
              echo "advisory=0"
              echo "blocked=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## niha governance check"
              echo ""
              echo "**ERROR** - $1"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$threshold" = "never" ]; then exit 0; fi
            exit 1
          }

          # The key goes in on stdin so it never appears in process args.
          if ! printf '%s\n' "$NIHA_API_KEY" | niha login --api-key -; then
            report_error "niha login failed. Check that the NIHA_API_KEY secret holds a valid, unrevoked API key."
          fi

          # --annotate writes ::error/::warning commands to stderr; stdout
          # stays clean JSON.
          set +e
          niha check --ci --json --annotate > "$trace"
          check_exit=$?
          set -e

          if ! jq -e . "$trace" >/dev/null 2>&1; then
            sed 's/^/  /' "$trace" || true
            report_error "niha check did not return valid JSON (exit $check_exit), so the verdict could not be read."
          fi

          decision=$(jq -r '.result // "UNKNOWN"' "$trace")
          passed=$(jq -r '.passed // 0' "$trace")
          advisory=$(jq -r '.advisory // 0' "$trace")
          blocked=$(jq -r '.blocked // 0' "$trace")
          rules_evaluated=$(jq -r '.rules_evaluated // .total // 0' "$trace")

          {
            echo "decision=$decision"
            echo "passed=$passed"
            echo "advisory=$advisory"
            echo "blocked=$blocked"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## niha governance check"
            echo ""
            echo "| Verdict | Passed | Advisory | Blocked |"
            echo "|---|---|---|---|"
            echo "| **$decision** | $passed | $advisory | $blocked |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$threshold" = "never" ]; then exit 0; fi

          # An empty workspace is a misconfiguration, not a pass.
          if [ "$rules_evaluated" -eq 0 ] || [ "$decision" = "NO_RULES" ]; then
            echo "::error::No governance rules are configured for this workspace. Add rules in the niha console, or set NIHA_FAIL_ON to never."
            exit 1
          fi

          case "$threshold" in
            advisory|restricted)
              if [ "$blocked" -gt 0 ] || [ "$advisory" -gt 0 ]; then exit 1; fi
              exit 0
              ;;
            *)
              exit $check_exit
              ;;
          esac

      - name: Post PR comment
        if: always() && steps.evaluate.outputs.decision != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DECISION: ${{ steps.evaluate.outputs.decision }}
          PASSED: ${{ steps.evaluate.outputs.passed }}
          ADVISORY: ${{ steps.evaluate.outputs.advisory }}
          BLOCKED: ${{ steps.evaluate.outputs.blocked }}
        run: |
          set -euo pipefail
          icon=$([ "$DECISION" = "PASS" ] && echo "✅" || echo "❌")
          body=$(mktemp)
          {
            echo "$icon **niha governance check - $DECISION**"
            echo ""
            echo "| Passed | Advisory | Blocked |"
            echo "|---|---|---|"
            echo "| $PASSED | $ADVISORY | $BLOCKED |"
            if [ "$BLOCKED" -gt 0 ]; then
              echo ""
              echo "<details><summary>Blocked rules</summary>"
              echo ""
              jq -r '.rules[] | select(.status == "blocked") | "- **\(.rule_id)** \(.name): \(.message)"' /tmp/niha-trace.json
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "_run by niha governance CI, workflow: ${GITHUB_WORKFLOW}_"
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
